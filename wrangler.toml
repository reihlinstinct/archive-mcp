name = "archive-mcp"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# KV is auto-provisioned on first deploy. Secrets AUTH_TOKEN, ENC_SECRET and the optional OAuth client (OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET, OAUTH_REDIRECT_URIS) are set with `wrangler secret put`.
[[kv_namespaces]]
binding = "ARCHIVES"
